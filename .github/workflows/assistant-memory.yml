name: Del Assistant memory

# Asks the ERP to run the assistant's nightly learning (AST-3): conversations that ended without "New chat"
# and routines / repeated corrections from the audit log. It does nothing unless the repository variable
# ASSISTANT_MEMORY_ENABLED is 'true', and it runs only on main. The ERP side also needs ASSISTANT_V2=true,
# ANTHROPIC_API_KEY and ASSISTANT_CRON_SECRET (set on the server by hand, never in this repository).
# This workflow holds only the shared secret and the address.

on:
  schedule:
    - cron: "30 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  learn:
    if: ${{ vars.ASSISTANT_MEMORY_ENABLED == 'true' && github.ref_name == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ask the ERP to learn
        env:
          ASSISTANT_CRON_SECRET: ${{ secrets.ASSISTANT_CRON_SECRET }}
          ERP_BASE_URL: ${{ vars.ERP_BASE_URL }}
        run: |
          set -eu
          if [ -z "${ASSISTANT_CRON_SECRET}" ] || [ -z "${ERP_BASE_URL}" ]; then
            echo "ASSISTANT_CRON_SECRET (secret) and ERP_BASE_URL (variable) must be set." >&2
            exit 1
          fi
          code=$(curl --silent --show-error --max-time 290 --output response.json --write-out '%{http_code}' \
            --request POST "${ERP_BASE_URL%/}/api/assistant/learn/nightly" \
            --header "Authorization: Bearer ${ASSISTANT_CRON_SECRET}")
          echo "HTTP ${code}"
          cat response.json
          echo
          [ "${code}" = "200" ]
