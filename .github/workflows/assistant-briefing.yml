name: Del Assistant morning briefing

# Asks the ERP to write the morning briefings (AST-6): one short message per admin / manager with
# yesterday's sales, cash, overdue receivables, stock risks, new guard findings and three suggestions.
# 02:30 UTC = 06:30 in Baku. It does nothing unless the repository variable ASSISTANT_BRIEFING_ENABLED is
# 'true', and it runs only on main. The ERP side also needs ASSISTANT_V2=true, ANTHROPIC_API_KEY and
# ASSISTANT_CRON_SECRET (set on the server by hand, never in this repository). This workflow holds only
# the shared secret and the address (the same ones as the memory workflow).

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  brief:
    if: ${{ vars.ASSISTANT_BRIEFING_ENABLED == 'true' && github.ref_name == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ask the ERP to write the briefings
        env:
          ASSISTANT_CRON_SECRET: ${{ secrets.ASSISTANT_CRON_SECRET }}
          ERP_BASE_URL: ${{ vars.ERP_BASE_URL }}
        run: |
          set -eu
          if [ -z "${ASSISTANT_CRON_SECRET}" ] || [ -z "${ERP_BASE_URL}" ]; then
            echo "ASSISTANT_CRON_SECRET (secret) and ERP_BASE_URL (variable) must be set." >&2
            exit 1
          fi
          code=$(curl --silent --show-error --max-time 290 --output response.json --write-out '%{http_code}' \
            --request POST "${ERP_BASE_URL%/}/api/assistant/briefing/nightly" \
            --header "Authorization: Bearer ${ASSISTANT_CRON_SECRET}")
          echo "HTTP ${code}"
          cat response.json
          echo
          [ "${code}" = "200" ]
