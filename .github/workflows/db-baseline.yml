name: db-baseline

# Builds an empty ERP database from supabase/baseline + supabase/migrations on a
# plain Postgres 17 (no Docker, no Supabase stack) and checks that the baseline
# matches the production catalog snapshot in supabase/baseline/live-catalog.json.
# Never connects to production.
on:
  pull_request:
    paths:
      - "supabase/**"
      - "scripts/db/**"
      - ".github/workflows/db-baseline.yml"
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "scripts/db/**"
      - ".github/workflows/db-baseline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-fresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:55432/postgres
    steps:
      - uses: actions/checkout@v5

      - name: Install Postgres 17
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Start an empty server
        run: |
          PGDATA="$RUNNER_TEMP/pgdata"
          initdb -D "$PGDATA" -U postgres --auth=trust -E UTF8 --locale=C.UTF-8 > /dev/null
          pg_ctl -D "$PGDATA" -o "-p 55432 -k $RUNNER_TEMP -c wal_level=logical" -l "$RUNNER_TEMP/pg.log" -w start
          psql "$DATABASE_URL" -Atc "select version()"

      - name: Generated baseline files are up to date
        run: |
          python3 scripts/db/generate-baseline.py
          git diff --exit-code -- supabase/baseline supabase/modules || {
            echo "::error::supabase/baseline/*.sql or supabase/modules/*/install.sql does not match live-catalog.json. Run python3 scripts/db/generate-baseline.py and commit."
            exit 1
          }
          untracked=$(git ls-files --others --exclude-standard -- supabase/baseline supabase/modules)
          [[ -z "$untracked" ]] || { echo "::error::generated files not committed: $untracked"; exit 1; }

      - name: Build from baseline
        run: scripts/db/build-fresh.sh --plain-postgres --baseline-only

      - name: Compare with production snapshot
        run: |
          psql "$DATABASE_URL" -X -q -At -f supabase/baseline/catalog.sql > "$RUNNER_TEMP/fresh-catalog.json"
          set +e
          python3 scripts/db/compare-catalog.py supabase/baseline/live-catalog.json "$RUNNER_TEMP/fresh-catalog.json" | tee "$RUNNER_TEMP/diff.txt"
          rc=${PIPESTATUS[0]}
          { echo '### Baseline vs production snapshot'; echo '```'; tail -n 200 "$RUNNER_TEMP/diff.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Baseline is safe to re-run
        run: scripts/db/build-fresh.sh --plain-postgres --baseline-only

      - name: Newer migrations apply on top of the baseline
        run: scripts/db/build-fresh.sh --plain-postgres

      # Plan limits in the tenant database (prompt 12): seats trigger, storage policy, status.
      - name: Tenant limits checks
        run: |
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -At -f supabase/tests/tenant_limits.sql | tee "$RUNNER_TEMP/tenant_limits.txt"
          grep -q "ALL CHECKS PASSED" "$RUNNER_TEMP/tenant_limits.txt"

      # Saved searches of the view engine (prompt 17): private per user, one default per screen.
      - name: View favourites checks
        run: |
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -At -f supabase/tests/view_favorites.sql | tee "$RUNNER_TEMP/view_favorites.txt"
          grep -q "ALL CHECKS PASSED" "$RUNNER_TEMP/view_favorites.txt"

      # Invoice payments keep the date the user picked (sales list payment dialog).
      - name: Invoice payment date checks
        run: |
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -At -f supabase/tests/invoice_payment_date.sql | tee "$RUNNER_TEMP/invoice_payment_date.txt"
          grep -q "ALL CHECKS PASSED" "$RUNNER_TEMP/invoice_payment_date.txt"

      # Activities and chatter (phase 19): RLS follows the record, authors and logs protected.
      - name: Activities and chatter checks
        run: |
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -At -f supabase/tests/activities_chatter.sql | tee "$RUNNER_TEMP/activities_chatter.txt"
          grep -q "ALL CHECKS PASSED" "$RUNNER_TEMP/activities_chatter.txt"

      # Calendar (phase 20): public/private events, organizer rights, answers, reminders, meetings.
      - name: Calendar checks
        run: |
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -At -f supabase/tests/calendar.sql | tee "$RUNNER_TEMP/calendar.txt"
          grep -q "ALL CHECKS PASSED" "$RUNNER_TEMP/calendar.txt"
      # To-do (phase 22): tasks only for their members, personal stages, done stage, chatter.
      - name: To-do checks
        run: |
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -At -f supabase/tests/todo.sql | tee "$RUNNER_TEMP/todo.txt"
          grep -q "ALL CHECKS PASSED" "$RUNNER_TEMP/todo.txt"
      # Documents (phase 23): folder rules by role and user, files, requests, system folders.
      - name: Documents checks
        run: |
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -At -f supabase/tests/documents.sql | tee "$RUNNER_TEMP/documents.txt"
          grep -q "ALL CHECKS PASSED" "$RUNNER_TEMP/documents.txt"
      # CRM pipeline (prompt 21): teams, stages, stage sync with the classic code, won/lost, targets.
      - name: CRM pipeline checks
        run: |
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -At -f supabase/tests/crm_pipeline.sql | tee "$RUNNER_TEMP/crm_pipeline.txt"
          grep -q "ALL CHECKS PASSED" "$RUNNER_TEMP/crm_pipeline.txt"
      # Widget home (prompt 24b): own layouts, admin-only company default, financial functions refuse non-financial users.
      - name: Home widgets checks
        run: |
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -At -f supabase/tests/home_widgets.sql | tee "$RUNNER_TEMP/home_widgets.txt"
          grep -q "ALL CHECKS PASSED" "$RUNNER_TEMP/home_widgets.txt"
      # Stock integrity and inventory counts (fix F2): zero-stock products counted, stock trigger
      # deltas per warehouse, admin-only backdating, as-of quantities, unpost and re-post.
      - name: Inventory count integrity checks
        run: |
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -At -f supabase/tests/inventory_count_integrity.sql | tee "$RUNNER_TEMP/inventory_count_integrity.txt"
          grep -q "ALL CHECKS PASSED" "$RUNNER_TEMP/inventory_count_integrity.txt"
      # Backdated invoices and payments, admin edit of posted invoices (fix F1).
      - name: Backdated invoices checks
        run: |
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -At -f supabase/tests/backdated_invoices.sql | tee "$RUNNER_TEMP/backdated_invoices.txt"
          grep -q "ALL CHECKS PASSED" "$RUNNER_TEMP/backdated_invoices.txt"
      # Stock exits per warehouse (fix F3): write-offs, sales, production, purchases.
      - name: Stock per warehouse checks
        run: |
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -At -f supabase/tests/stock_per_warehouse.sql | tee "$RUNNER_TEMP/stock_per_warehouse.txt"
          grep -q "ALL CHECKS PASSED" "$RUNNER_TEMP/stock_per_warehouse.txt"
      # List columns (prompt 24c): created_by triggers and backfill, profile_display_names.
      - name: List columns checks
        run: |
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -At -f supabase/tests/list_columns.sql | tee "$RUNNER_TEMP/list_columns.txt"
          grep -q "ALL CHECKS PASSED" "$RUNNER_TEMP/list_columns.txt"
      # Duplicate product names (fix F4): duplicate_name in the stock integrity report.
      - name: Duplicate product names checks
        run: |
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -At -f supabase/tests/duplicate_product_names.sql | tee "$RUNNER_TEMP/duplicate_product_names.txt"
          grep -q "ALL CHECKS PASSED" "$RUNNER_TEMP/duplicate_product_names.txt"
      # Imports (IMP-1): tables, numbering, atomic draft save, RLS by permission and financial figures.
      - name: Imports core checks
        run: |
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -At -f supabase/tests/imports_core.sql | tee "$RUNNER_TEMP/imports_core.txt"
          grep -q "ALL CHECKS PASSED" "$RUNNER_TEMP/imports_core.txt"
      # Imports posting (IMP-2): confirm, receive into two warehouses, late cost on sold stock,
      # estimate to actual, split payment, close, cancel and storno, period lock, idempotency.
      - name: Imports posting checks
        run: |
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -At -f supabase/tests/imports_posting.sql | tee "$RUNNER_TEMP/imports_posting.txt"
          grep -q "ALL CHECKS PASSED" "$RUNNER_TEMP/imports_posting.txt"
      # Imports exchange differences (IMP-3): partial payments at other rates, prepayments.
      - name: Imports exchange difference checks
        run: |
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -At -f supabase/tests/imports_fx.sql | tee "$RUNNER_TEMP/imports_fx.txt"
          grep -q "ALL CHECKS PASSED" "$RUNNER_TEMP/imports_fx.txt"

      - name: Server log on failure
        if: failure()
        run: tail -n 100 "$RUNNER_TEMP/pg.log" || true
