name: db-baseline

# Builds an empty ERP database from supabase/baseline + supabase/migrations on a
# plain Postgres 17 (no Docker, no Supabase stack) and checks that the baseline
# matches the production catalog snapshot in supabase/baseline/live-catalog.json.
# Never connects to production.
on:
  pull_request:
    paths:
      - "supabase/**"
      - "scripts/db/**"
      - ".github/workflows/db-baseline.yml"
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "scripts/db/**"
      - ".github/workflows/db-baseline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-fresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:55432/postgres
    steps:
      - uses: actions/checkout@v5

      - name: Install Postgres 17
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Start an empty server
        run: |
          PGDATA="$RUNNER_TEMP/pgdata"
          initdb -D "$PGDATA" -U postgres --auth=trust -E UTF8 --locale=C.UTF-8 > /dev/null
          pg_ctl -D "$PGDATA" -o "-p 55432 -k $RUNNER_TEMP -c wal_level=logical" -l "$RUNNER_TEMP/pg.log" -w start
          psql "$DATABASE_URL" -Atc "select version()"

      - name: Generated baseline files are up to date
        run: |
          python3 scripts/db/generate-baseline.py
          git diff --exit-code -- supabase/baseline supabase/modules || {
            echo "::error::supabase/baseline/*.sql or supabase/modules/*/install.sql does not match live-catalog.json. Run python3 scripts/db/generate-baseline.py and commit."
            exit 1
          }
          untracked=$(git ls-files --others --exclude-standard -- supabase/baseline supabase/modules)
          [[ -z "$untracked" ]] || { echo "::error::generated files not committed: $untracked"; exit 1; }

      - name: Build from baseline
        run: scripts/db/build-fresh.sh --plain-postgres --baseline-only

      - name: Compare with production snapshot
        run: |
          psql "$DATABASE_URL" -X -q -At -f supabase/baseline/catalog.sql > "$RUNNER_TEMP/fresh-catalog.json"
          set +e
          python3 scripts/db/compare-catalog.py supabase/baseline/live-catalog.json "$RUNNER_TEMP/fresh-catalog.json" | tee "$RUNNER_TEMP/diff.txt"
          rc=${PIPESTATUS[0]}
          { echo '### Baseline vs production snapshot'; echo '```'; tail -n 200 "$RUNNER_TEMP/diff.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Baseline is safe to re-run
        run: scripts/db/build-fresh.sh --plain-postgres --baseline-only

      - name: Newer migrations apply on top of the baseline
        run: scripts/db/build-fresh.sh --plain-postgres

      # Plan limits in the tenant database (prompt 12): seats trigger, storage policy, status.
      - name: Tenant limits checks
        run: |
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -At -f supabase/tests/tenant_limits.sql | tee "$RUNNER_TEMP/tenant_limits.txt"
          grep -q "ALL CHECKS PASSED" "$RUNNER_TEMP/tenant_limits.txt"

      # Saved searches of the view engine (prompt 17): private per user, one default per screen.
      - name: View favourites checks
        run: |
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -At -f supabase/tests/view_favorites.sql | tee "$RUNNER_TEMP/view_favorites.txt"
          grep -q "ALL CHECKS PASSED" "$RUNNER_TEMP/view_favorites.txt"

      # Invoice payments keep the date the user picked (sales list payment dialog).
      - name: Invoice payment date checks
        run: |
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -At -f supabase/tests/invoice_payment_date.sql | tee "$RUNNER_TEMP/invoice_payment_date.txt"
          grep -q "ALL CHECKS PASSED" "$RUNNER_TEMP/invoice_payment_date.txt"

      # DATE-1: change the date of a posted sale / purchase in place (timeline checks R1-R8).
      - name: Document date change checks
        run: |
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -At -f supabase/tests/document_date_change.sql | tee "$RUNNER_TEMP/document_date_change.txt"
          grep -q "ALL CHECKS PASSED" "$RUNNER_TEMP/document_date_change.txt"

      # DATE-2: the date of an invoice payment, a partner payment, a manual cash row or an expense.
      - name: Cash document date change checks
        run: |
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -At -f supabase/tests/document_date_change_cash.sql | tee "$RUNNER_TEMP/document_date_change_cash.txt"
          grep -q "ALL CHECKS PASSED" "$RUNNER_TEMP/document_date_change_cash.txt"

      # DATE-3: the date of a stock transfer, write-off, initial balance, posted count, import receipt or payment.
      - name: Inventory document date change checks
        run: |
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -At -f supabase/tests/document_date_change_inventory.sql | tee "$RUNNER_TEMP/document_date_change_inventory.txt"
          grep -q "ALL CHECKS PASSED" "$RUNNER_TEMP/document_date_change_inventory.txt"

      # LOT-1: lots on every stock change, backfill, FEFO / reverse / mirror, Polywood cuts, integrity, date changes.
      - name: Lot tracking core checks
        run: |
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -At -f supabase/tests/lot_core.sql | tee "$RUNNER_TEMP/lot_core.txt"
          grep -q "ALL CHECKS PASSED" "$RUNNER_TEMP/lot_core.txt"

      # LOT-2: inbound documents create named lots (imports, purchases, initial balance, production, counts).
      - name: Lot inbound checks
        run: |
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -At -f supabase/tests/lot_inbound.sql | tee "$RUNNER_TEMP/lot_inbound.txt"
          grep -q "ALL CHECKS PASSED" "$RUNNER_TEMP/lot_inbound.txt"

      # LOT-3: outbound and moving documents record their lots (sales, write-offs, production, consignment, transfers).
      - name: Lot outbound checks
        run: |
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -At -f supabase/tests/lot_outbound.sql | tee "$RUNNER_TEMP/lot_outbound.txt"
          grep -q "ALL CHECKS PASSED" "$RUNNER_TEMP/lot_outbound.txt"

      # LOT-4: reads of the lot screens (card figures, movements page, forward trace, lots.view).
      - name: Lot screen read checks
        run: |
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -At -f supabase/tests/lot_ui.sql | tee "$RUNNER_TEMP/lot_ui.txt"
          grep -q "ALL CHECKS PASSED" "$RUNNER_TEMP/lot_ui.txt"

      # Activities and chatter (phase 19): RLS follows the record, authors and logs protected.
      - name: Activities and chatter checks
        run: |
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -At -f supabase/tests/activities_chatter.sql | tee "$RUNNER_TEMP/activities_chatter.txt"
          grep -q "ALL CHECKS PASSED" "$RUNNER_TEMP/activities_chatter.txt"

      # Calendar (phase 20): public/private events, organizer rights, answers, reminders, meetings.
      - name: Calendar checks
        run: |
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -At -f supabase/tests/calendar.sql | tee "$RUNNER_TEMP/calendar.txt"
          grep -q "ALL CHECKS PASSED" "$RUNNER_TEMP/calendar.txt"
      # To-do (phase 22): tasks only for their members, personal stages, done stage, chatter.
      - name: To-do checks
        run: |
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -At -f supabase/tests/todo.sql | tee "$RUNNER_TEMP/todo.txt"
          grep -q "ALL CHECKS PASSED" "$RUNNER_TEMP/todo.txt"
      # Documents (phase 23): folder rules by role and user, files, requests, system folders.
      - name: Documents checks
        run: |
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -At -f supabase/tests/documents.sql | tee "$RUNNER_TEMP/documents.txt"
          grep -q "ALL CHECKS PASSED" "$RUNNER_TEMP/documents.txt"
      # CRM pipeline (prompt 21): teams, stages, stage sync with the classic code, won/lost, targets.
      - name: CRM pipeline checks
        run: |
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -At -f supabase/tests/crm_pipeline.sql | tee "$RUNNER_TEMP/crm_pipeline.txt"
          grep -q "ALL CHECKS PASSED" "$RUNNER_TEMP/crm_pipeline.txt"
      # Widget home (prompt 24b): own layouts, admin-only company default, financial functions refuse non-financial users.
      - name: Home widgets checks
        run: |
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -At -f supabase/tests/home_widgets.sql | tee "$RUNNER_TEMP/home_widgets.txt"
          grep -q "ALL CHECKS PASSED" "$RUNNER_TEMP/home_widgets.txt"
      # Stock integrity and inventory counts (fix F2): zero-stock products counted, stock trigger
      # deltas per warehouse, admin-only backdating, as-of quantities, unpost and re-post.
      - name: Inventory count integrity checks
        run: |
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -At -f supabase/tests/inventory_count_integrity.sql | tee "$RUNNER_TEMP/inventory_count_integrity.txt"
          grep -q "ALL CHECKS PASSED" "$RUNNER_TEMP/inventory_count_integrity.txt"
      # People responsible for a count (INV-4): rules per status, admin on posted, employee choices
      # without can_view_hr, writes only through the RPC.
      - name: Inventory count responsibles checks
        run: |
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -At -f supabase/tests/inventory_count_responsibles.sql | tee "$RUNNER_TEMP/inventory_count_responsibles.txt"
          grep -q "ALL CHECKS PASSED" "$RUNNER_TEMP/inventory_count_responsibles.txt"
      # Journal entry numbers from a sequence: 2,000 entries on one day, no collision.
      - name: Journal entry number checks
        run: |
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -At -f supabase/tests/journal_entry_no.sql | tee "$RUNNER_TEMP/journal_entry_no.txt"
          grep -q "ALL CHECKS PASSED" "$RUNNER_TEMP/journal_entry_no.txt"
      # Partner ledger (LED-1): every money flow of a partner, statement, balances, integrity check.
      - name: Partner ledger checks
        run: |
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -At -f supabase/tests/partner_ledger_test.sql | tee "$RUNNER_TEMP/partner_ledger.txt"
          grep -q "ALL CHECKS PASSED" "$RUNNER_TEMP/partner_ledger.txt"
      # GL partner tags (LED-2): partner on every 1200 / 2100 line, history report and backfill.
      - name: GL partner tags checks
        run: |
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -At -f supabase/tests/gl_partner_tags.sql | tee "$RUNNER_TEMP/gl_partner_tags.txt"
          grep -q "ALL CHECKS PASSED" "$RUNNER_TEMP/gl_partner_tags.txt"
      # Partner statement details (LED-3): contact fields, document and author per line; same totals.
      - name: Partner statement details checks
        run: |
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -At -f supabase/tests/partner_statement_details.sql | tee "$RUNNER_TEMP/partner_statement_details.txt"
          grep -q "ALL CHECKS PASSED" "$RUNNER_TEMP/partner_statement_details.txt"
      # Debtor / creditor reports and turnover (LED-4): open items FIFO, filters, paging, turnover = statement.
      - name: Partner debtor report checks
        run: |
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -At -f supabase/tests/partner_debtor_reports.sql | tee "$RUNNER_TEMP/partner_debtor_reports.txt"
          grep -q "ALL CHECKS PASSED" "$RUNNER_TEMP/partner_debtor_reports.txt"
      # Backdated invoices and payments, admin edit of posted invoices (fix F1).
      - name: Backdated invoices checks
        run: |
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -At -f supabase/tests/backdated_invoices.sql | tee "$RUNNER_TEMP/backdated_invoices.txt"
          grep -q "ALL CHECKS PASSED" "$RUNNER_TEMP/backdated_invoices.txt"
      # Stock exits per warehouse (fix F3): write-offs, sales, production, purchases.
      - name: Stock per warehouse checks
        run: |
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -At -f supabase/tests/stock_per_warehouse.sql | tee "$RUNNER_TEMP/stock_per_warehouse.txt"
          grep -q "ALL CHECKS PASSED" "$RUNNER_TEMP/stock_per_warehouse.txt"
      # List columns (prompt 24c): created_by triggers and backfill, profile_display_names.
      - name: List columns checks
        run: |
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -At -f supabase/tests/list_columns.sql | tee "$RUNNER_TEMP/list_columns.txt"
          grep -q "ALL CHECKS PASSED" "$RUNNER_TEMP/list_columns.txt"
      # Duplicate product names (fix F4): duplicate_name in the stock integrity report.
      - name: Duplicate product names checks
        run: |
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -At -f supabase/tests/duplicate_product_names.sql | tee "$RUNNER_TEMP/duplicate_product_names.txt"
          grep -q "ALL CHECKS PASSED" "$RUNNER_TEMP/duplicate_product_names.txt"
      # Imports (IMP-1): tables, numbering, atomic draft save, RLS by permission and financial figures.
      - name: Imports core checks
        run: |
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -At -f supabase/tests/imports_core.sql | tee "$RUNNER_TEMP/imports_core.txt"
          grep -q "ALL CHECKS PASSED" "$RUNNER_TEMP/imports_core.txt"
      # Imports posting (IMP-2): confirm, receive into two warehouses, late cost on sold stock,
      # estimate to actual, split payment, close, cancel and storno, period lock, idempotency.
      - name: Imports posting checks
        run: |
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -At -f supabase/tests/imports_posting.sql | tee "$RUNNER_TEMP/imports_posting.txt"
          grep -q "ALL CHECKS PASSED" "$RUNNER_TEMP/imports_posting.txt"
      # Imports exchange differences (IMP-3): partial payments at other rates, prepayments.
      - name: Imports exchange difference checks
        run: |
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -At -f supabase/tests/imports_fx.sql | tee "$RUNNER_TEMP/imports_fx.txt"
          grep -q "ALL CHECKS PASSED" "$RUNNER_TEMP/imports_fx.txt"

      # Deleting a draft import (UI-5): only a draft with nothing posted; prepaid / confirmed are cancelled.
      - name: Imports delete draft checks
        run: |
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -At -f supabase/tests/imports_delete_draft.sql | tee "$RUNNER_TEMP/imports_delete_draft.txt"
          grep -q "ALL CHECKS PASSED" "$RUNNER_TEMP/imports_delete_draft.txt"

      # Warehouse per import line and one line split over several warehouses (IMP-4).
      - name: Imports line warehouses checks
        run: |
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -At -f supabase/tests/imports_line_warehouses.sql | tee "$RUNNER_TEMP/imports_line_warehouses.txt"
          grep -q "ALL CHECKS PASSED" "$RUNNER_TEMP/imports_line_warehouses.txt"

      # One payment from several accounts; Pay on import costs; stages and tracking (IMP-5).
      - name: Imports stages and pay checks
        run: |
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -At -f supabase/tests/imports_stages_pay.sql | tee "$RUNNER_TEMP/imports_stages_pay.txt"
          grep -q "ALL CHECKS PASSED" "$RUNNER_TEMP/imports_stages_pay.txt"

      - name: Imports typed customs duty checks
        run: |
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -At -f supabase/tests/imports_duty_override.sql | tee "$RUNNER_TEMP/imports_duty_override.txt"
          grep -q "ALL CHECKS PASSED" "$RUNNER_TEMP/imports_duty_override.txt"

      - name: Partner payment ledger checks (GL-1)
        run: |
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -At -f supabase/tests/gl_partner_cash_account.sql | tee "$RUNNER_TEMP/gl_partner_cash_account.txt"
          grep -q "ALL CHECKS PASSED" "$RUNNER_TEMP/gl_partner_cash_account.txt"

      # Accounting Guard core (GUARD-1): every rule's bad / good case, upsert, auto-resolve,
      # false positives, admin-only access, and no write to business data.
      - name: Accounting guard checks
        run: |
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -At -f supabase/tests/accounting_guard.sql | tee "$RUNNER_TEMP/accounting_guard.txt"
          grep -q "ALL CHECKS PASSED" "$RUNNER_TEMP/accounting_guard.txt"

      # Accounting Guard section (GUARD-3): dashboard figures, rule updates, bulk status, reports, the bell, admin only.
      - name: Accounting guard section checks
        run: |
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -At -f supabase/tests/accounting_guard_ui.sql | tee "$RUNNER_TEMP/accounting_guard_ui.txt"
          grep -q "ALL CHECKS PASSED" "$RUNNER_TEMP/accounting_guard_ui.txt"

      # Accounting Guard schedule (GUARD-4): off by default, first scan full, incremental scans, retention, validation, pg_cron jobs.
      - name: Accounting guard schedule checks
        run: |
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -At -f supabase/tests/accounting_guard_cron.sql | tee "$RUNNER_TEMP/accounting_guard_cron.txt"
          grep -q "ALL CHECKS PASSED" "$RUNNER_TEMP/accounting_guard_cron.txt"

      # Accounting Guard accountant agent (GUARD-5): memory, the agent's suggestion on a finding, the monthly cost, admin only.
      - name: Accounting guard agent checks
        run: |
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -At -f supabase/tests/accounting_guard_agent.sql | tee "$RUNNER_TEMP/accounting_guard_agent.txt"
          grep -q "ALL CHECKS PASSED" "$RUNNER_TEMP/accounting_guard_agent.txt"

      # Del Assistant core (AST-1): conversation context, usage source, monthly cost (admin / server only).
      - name: Assistant core checks
        run: |
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -At -f supabase/tests/assistant_core.sql | tee "$RUNNER_TEMP/assistant_core.txt"
          grep -q "ALL CHECKS PASSED" "$RUNNER_TEMP/assistant_core.txt"

      - name: Server log on failure
        if: failure()
        run: tail -n 100 "$RUNNER_TEMP/pg.log" || true
