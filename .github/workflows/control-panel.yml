name: control-panel

# Lint, tests and build of the control panel (control-panel/), plus its database
# checks on a plain Postgres 17: the migrations run twice, then
# supabase/tests/rls_and_audit.sql checks RLS, the audit log and Vault secrets.
# Never connects to any Supabase project.
on:
  pull_request:
    paths:
      - "control-panel/**"
      - "src/design-system/**"
      - "src/modules/*/manifest.ts"
      - "scripts/db/supabase-shim.sql"
      # Provisioning applies the ERP schema (control-panel/tests/provisioning.test.mjs reads it).
      - "supabase/baseline/**"
      - "supabase/modules/**"
      - "supabase/migrations/**"
      # Tenant migrations (prompt 10): the engine lives in control-panel/lib/migrations.
      - "scripts/tenants/**"
      - "supabase/scripts/tenant1_*.sql"
      - "src/lib/tenant/**"
      - "scripts/db/**"
      - ".github/workflows/control-panel.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: control-panel
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: control-panel/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:55432/postgres
    steps:
      - uses: actions/checkout@v5

      - name: Install Postgres 17
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Start an empty server
        run: |
          PGDATA="$RUNNER_TEMP/pgdata"
          initdb -D "$PGDATA" -U postgres --auth=trust -E UTF8 --locale=C.UTF-8 > /dev/null
          pg_ctl -D "$PGDATA" -o "-p 55432 -k $RUNNER_TEMP -c wal_level=logical" -l "$RUNNER_TEMP/pg.log" -w start

      - name: Migrations (twice), RLS / audit and tenant lookup checks
        run: |
          PSQL=(psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1)
          "${PSQL[@]}" -f scripts/db/supabase-shim.sql
          "${PSQL[@]}" -f control-panel/supabase/tests/vault-shim.sql
          for pass in 1 2; do
            for f in control-panel/supabase/migrations/*.sql; do "${PSQL[@]}" -f "$f"; done
          done
          for t in rls_and_audit runtime_lookup tenant_migrations; do
            "${PSQL[@]}" -f "control-panel/supabase/tests/$t.sql" | tee "$RUNNER_TEMP/$t.txt"
            grep -q "ALL CHECKS PASSED" "$RUNNER_TEMP/$t.txt"
          done

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # Three local tenants + a local control plane: a new migration reaches the canary
      # first, a broken one stops the run after the canary (scripts/tenants/e2e-local.sh).
      - name: Tenant migrations rehearsal
        env:
          PG_BASE_URL: postgresql://postgres@127.0.0.1:55432
        run: scripts/tenants/e2e-local.sh

      # Tenant #1 cutover (prompt 11): the runbook's database steps on a stand-in for
      # production built from the snapshot (docs/runbooks/tenant-1-cutover.md).
      - name: Tenant 1 cutover rehearsal
        env:
          PG_BASE_URL: postgresql://postgres@127.0.0.1:55432
        run: scripts/tenants/rehearse-tenant-1.sh

      - name: Server log on failure
        if: failure()
        run: tail -n 100 "$RUNNER_TEMP/pg.log" || true
