<!doctype html>
<!-- Source: https://vibeprompts.dev/auth/auth-recovery-code-sign-in/ (free prompt library). Reference only: rebuild as a React component with our design tokens. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recovery code sign-in</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-neutral-50 antialiased">
<div class="flex min-h-screen items-center justify-center bg-neutral-50 p-6">
  <section class="w-full max-w-sm rounded-2xl border border-neutral-200 bg-white p-6 shadow-sm">
    <div class="flex h-11 w-11 items-center justify-center rounded-xl bg-amber-50 text-lg text-amber-700">#</div>
    <h1 class="mt-5 text-xl font-semibold text-neutral-900">Use a recovery code</h1>
    <p class="mt-2 text-sm leading-6 text-neutral-500">Enter one of the single-use codes you saved when two-step verification was enabled.</p>
    <form id="recoveryForm" class="mt-6">
      <label for="recoveryCode" class="text-sm font-medium text-neutral-700">Recovery code</label>
      <input id="recoveryCode" maxlength="9" autocomplete="one-time-code" placeholder="XXXX-XXXX" class="mt-2 w-full rounded-xl border border-neutral-200 px-4 py-3 text-center font-mono text-lg tracking-[0.22em] uppercase outline-none focus:border-neutral-900 focus:ring-4 focus:ring-neutral-900/10" />
      <p id="recoveryError" class="mt-2 hidden text-sm text-red-600" role="alert"></p>
      <p class="mt-3 text-xs text-neutral-400">You have 7 unused recovery codes remaining.</p>
      <button id="recoverySubmit" disabled class="mt-5 w-full rounded-xl bg-neutral-900 px-4 py-2.5 text-sm font-medium text-white disabled:cursor-not-allowed disabled:opacity-40">Verify code</button>
    </form>
    <div id="recoverySuccess" class="mt-6 hidden rounded-xl bg-green-50 p-4 text-sm text-green-700" role="status">Identity verified. Redirecting to your workspace.</div>
    <div class="mt-6 flex justify-between text-sm"><a href="#" class="text-neutral-500 hover:text-neutral-900">Use authenticator</a><a href="#" class="font-medium text-neutral-700 hover:text-neutral-900">Contact support</a></div>
  </section>
</div>
<script>
var form = document.getElementById("recoveryForm");
var input = document.getElementById("recoveryCode");
var submit = document.getElementById("recoverySubmit");
var error = document.getElementById("recoveryError");
var success = document.getElementById("recoverySuccess");

function rawCode() { return input.value.replace(/[^A-Z0-9]/g, ""); }

input.addEventListener("input", function () {
  var raw = input.value.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8);
  input.value = raw.length > 4 ? raw.slice(0, 4) + "-" + raw.slice(4) : raw;
  submit.disabled = raw.length !== 8;
  error.classList.add("hidden");
  input.classList.remove("border-red-400");
});

form.addEventListener("submit", function (event) {
  event.preventDefault();
  submit.disabled = true;
  submit.textContent = "Checking…";
  setTimeout(function () {
    if (rawCode() === "SAFE2026") {
      form.classList.add("hidden");
      success.classList.remove("hidden");
      return;
    }
    error.textContent = "That recovery code is not valid or has already been used.";
    error.classList.remove("hidden");
    input.classList.add("border-red-400");
    submit.textContent = "Verify code";
    submit.disabled = false;
    input.focus();
    input.select();
  }, 650);
});
</script>
</body></html>
