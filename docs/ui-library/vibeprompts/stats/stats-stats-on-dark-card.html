<!doctype html>
<!-- Source: https://vibeprompts.dev/stats/stats-stats-on-dark-card/ (free prompt library). Reference only: rebuild as a React component with our design tokens. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stats on dark card</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-neutral-50 antialiased">
<section class="mx-auto max-w-4xl px-6 py-16">
  <div class="rounded-3xl bg-neutral-900 p-10 text-white">
    <h2 class="text-lg font-medium text-neutral-300">Trusted at scale</h2>
    <div class="mt-8 grid gap-8 sm:grid-cols-3">
      <div>
        <p class="text-4xl font-semibold">$1.2B</p>
        <p class="mt-1 text-sm text-neutral-400">Processed <span class="ml-1 rounded bg-green-500/15 px-1.5 py-0.5 text-xs text-green-400">↑ 24%</span></p>
      </div>
      <div>
        <p class="text-4xl font-semibold">38k</p>
        <p class="mt-1 text-sm text-neutral-400">Active teams <span class="ml-1 rounded bg-green-500/15 px-1.5 py-0.5 text-xs text-green-400">↑ 12%</span></p>
      </div>
      <div>
        <p class="text-4xl font-semibold">120ms</p>
        <p class="mt-1 text-sm text-neutral-400">Avg. latency <span class="ml-1 rounded bg-red-500/15 px-1.5 py-0.5 text-xs text-red-400">↓ 8%</span></p>
      </div>
    </div>
  </div>
</section>
</body></html>
