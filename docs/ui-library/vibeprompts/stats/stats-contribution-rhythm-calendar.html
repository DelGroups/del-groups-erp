<!doctype html>
<!-- Source: https://vibeprompts.dev/stats/stats-contribution-rhythm-calendar/ (free prompt library). Reference only: rebuild as a React component with our design tokens. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contribution rhythm calendar</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-neutral-50 antialiased">
<div class="mx-auto max-w-3xl p-6"><section class="rounded-2xl border border-neutral-200 bg-white p-5 shadow-sm"><header class="flex flex-col justify-between gap-3 sm:flex-row sm:items-start"><div><h2 class="text-sm font-semibold text-neutral-900">Contribution rhythm</h2><p class="mt-1 text-xs text-neutral-400">Last 12 weeks · Europe/Bratislava</p></div><select id="rhythmType" class="rounded-lg border border-neutral-200 px-3 py-2 text-xs"><option value="commits">Commits</option><option value="reviews">Reviews</option><option value="deploys">Deployments</option></select></header><div class="mt-6 overflow-x-auto"><div class="flex min-w-[620px] gap-2"><div class="grid grid-rows-7 gap-1 pt-0 text-[10px] text-neutral-400"><span></span><span>Mon</span><span></span><span>Wed</span><span></span><span>Fri</span><span></span></div><div id="rhythmGrid" class="grid flex-1 grid-flow-col grid-rows-7 gap-1"></div></div></div><div class="mt-4 flex items-center justify-end gap-1 text-[10px] text-neutral-400"><span class="mr-1">Less</span><span class="h-3 w-3 rounded-sm bg-neutral-100"></span><span class="h-3 w-3 rounded-sm bg-emerald-200"></span><span class="h-3 w-3 rounded-sm bg-emerald-400"></span><span class="h-3 w-3 rounded-sm bg-emerald-700"></span><span class="ml-1">More</span></div><div class="mt-5 grid grid-cols-3 gap-3 border-t border-neutral-100 pt-5 text-center"><div><strong id="rhythmStreak" class="text-xl text-neutral-900"></strong><p class="text-xs text-neutral-400">day streak</p></div><div><strong id="rhythmActive" class="text-xl text-neutral-900"></strong><p class="text-xs text-neutral-400">active days</p></div><div><strong id="rhythmBest" class="text-xl text-neutral-900"></strong><p class="text-xs text-neutral-400">strongest day</p></div></div></section></div>
<script>
var grid = document.getElementById("rhythmGrid"); var type = document.getElementById("rhythmType"); var labels = { commits: "commits", reviews: "reviews", deploys: "deployments" }; function renderRhythm() { grid.innerHTML = ""; var factor = type.value === "commits" ? 7 : type.value === "reviews" ? 4 : 2; var active = 0; var totals = [0, 0, 0, 0, 0, 0, 0]; for (var i = 0; i < 84; i += 1) { var value = (i * 11 + factor * 3 + Math.floor(i / 7)) % (factor + 2); var day = document.createElement("span"); var level = value === 0 ? "bg-neutral-100" : value < factor / 2 ? "bg-emerald-200" : value < factor ? "bg-emerald-400" : "bg-emerald-700"; day.className = "h-3.5 w-3.5 rounded-sm " + level; var date = new Date(); date.setDate(date.getDate() - (83 - i)); day.title = date.toLocaleDateString() + ": " + value + " " + labels[type.value]; day.setAttribute("aria-label", day.title); grid.appendChild(day); if (value) active += 1; totals[i % 7] += value; } document.getElementById("rhythmStreak").textContent = factor + 3; document.getElementById("rhythmActive").textContent = active; document.getElementById("rhythmBest").textContent = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"][totals.indexOf(Math.max.apply(null, totals))]; } type.addEventListener("change", renderRhythm); renderRhythm();
</script>
</body></html>
