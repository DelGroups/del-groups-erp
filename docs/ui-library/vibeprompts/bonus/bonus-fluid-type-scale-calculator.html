<!doctype html>
<!-- Source: https://vibeprompts.dev/bonus/bonus-fluid-type-scale-calculator/ (free prompt library). Reference only: rebuild as a React component with our design tokens. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fluid type scale calculator</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-neutral-50 antialiased">
<div class="mx-auto max-w-4xl p-6"><section class="grid overflow-hidden rounded-2xl border border-neutral-200 bg-white shadow-sm lg:grid-cols-[0.8fr_1.2fr]"><div class="border-b p-5 lg:border-b-0 lg:border-r"><h2 class="text-lg font-semibold text-neutral-900">Fluid type scale</h2><p class="mt-1 text-sm text-neutral-500">Generate a hierarchy that grows smoothly with the viewport.</p><div class="mt-6 grid grid-cols-2 gap-3"><label class="text-xs font-medium text-neutral-600">Min viewport<input id="typeMinView" type="number" value="320" min="240" class="mt-1.5 w-full rounded-xl border border-neutral-200 px-3 py-2.5 text-sm" /></label><label class="text-xs font-medium text-neutral-600">Max viewport<input id="typeMaxView" type="number" value="1440" min="480" class="mt-1.5 w-full rounded-xl border border-neutral-200 px-3 py-2.5 text-sm" /></label><label class="text-xs font-medium text-neutral-600">Min base<input id="typeMinBase" type="number" value="16" min="10" class="mt-1.5 w-full rounded-xl border border-neutral-200 px-3 py-2.5 text-sm" /></label><label class="text-xs font-medium text-neutral-600">Max base<input id="typeMaxBase" type="number" value="19" min="10" class="mt-1.5 w-full rounded-xl border border-neutral-200 px-3 py-2.5 text-sm" /></label></div><label class="mt-4 block text-xs font-medium text-neutral-600">Scale ratio<select id="typeRatio" class="mt-1.5 w-full rounded-xl border border-neutral-200 px-3 py-2.5 text-sm"><option value="1.2">Minor third · 1.200</option><option value="1.25" selected>Major third · 1.250</option><option value="1.333">Perfect fourth · 1.333</option></select></label><p id="typeError" class="mt-3 hidden text-xs text-red-600"></p><div id="typeDeclarations" class="mt-5 space-y-2"></div></div><div id="typePreview" class="flex min-h-[520px] flex-col justify-between bg-[#f2efe7] p-6 md:p-10"><div><p class="font-mono text-xs uppercase tracking-[0.2em] text-neutral-500">Field Notes · 026</p><h1 data-step="3" class="mt-8 max-w-xl font-serif leading-[0.95] tracking-tight text-neutral-950">A quieter way to build ambitious things.</h1><p data-step="1" class="mt-6 max-w-lg leading-7 text-neutral-600">Good systems make room for judgment. They provide structure without turning every decision into a form.</p></div><div class="flex items-end justify-between border-t border-neutral-300 pt-5"><p data-step="0" class="text-neutral-500">September 2026</p><p data-step="2" class="font-serif">Read the essay →</p></div></div></section></div>
<script>
var controls = ["typeMinView", "typeMaxView", "typeMinBase", "typeMaxBase", "typeRatio"].map(function (id) { return document.getElementById(id); }); function clampValue(minSize, maxSize, minView, maxView) { var slope = (maxSize - minSize) / (maxView - minView) * 100; var intercept = minSize - slope * minView / 100; return "clamp(" + minSize.toFixed(2) + "px, " + intercept.toFixed(2) + "px + " + slope.toFixed(3) + "vw, " + maxSize.toFixed(2) + "px)"; } function renderType() { var minView = Number(controls[0].value); var maxView = Number(controls[1].value); var minBase = Number(controls[2].value); var maxBase = Number(controls[3].value); var ratio = Number(controls[4].value); var valid = minView < maxView && minBase <= maxBase; document.getElementById("typeError").classList.toggle("hidden", valid); document.getElementById("typeError").textContent = valid ? "" : "Maximum viewport and base size must exceed their minimums."; if (!valid) return; var values = [0, 1, 2, 3].map(function (step) { return clampValue(minBase * Math.pow(ratio, step), maxBase * Math.pow(ratio, step), minView, maxView); }); document.getElementById("typeDeclarations").innerHTML = values.map(function (value, index) { return '<button data-copy-type class="flex w-full items-center justify-between gap-3 rounded-lg bg-neutral-50 px-3 py-2 text-left"><code class="truncate text-[10px] text-neutral-600">--step-' + index + ': ' + value + ';</code><span class="text-[10px] text-neutral-400">Copy</span></button>'; }).join(""); [].slice.call(document.querySelectorAll("[data-step]")).forEach(function (element) { element.style.fontSize = values[Number(element.getAttribute("data-step"))]; }); } document.addEventListener("click", function (event) { var button = event.target.closest("[data-copy-type]"); if (!button) return; var text = button.querySelector("code").textContent; if (navigator.clipboard) navigator.clipboard.writeText(text); button.querySelector("span").textContent = "Copied ✓"; setTimeout(function () { button.querySelector("span").textContent = "Copy"; }, 1200); }); controls.forEach(function (control) { control.addEventListener("input", renderType); }); renderType();
</script>
</body></html>
