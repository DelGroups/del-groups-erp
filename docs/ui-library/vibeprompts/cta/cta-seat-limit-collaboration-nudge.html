<!doctype html>
<!-- Source: https://vibeprompts.dev/cta/cta-seat-limit-collaboration-nudge/ (free prompt library). Reference only: rebuild as a React component with our design tokens. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seat limit collaboration nudge</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-neutral-50 antialiased">
<div class="mx-auto max-w-2xl p-6"><aside id="seatNudge" class="rounded-2xl border border-violet-200 bg-violet-50 p-5"><div class="flex flex-col gap-5 sm:flex-row sm:items-center"><div class="flex -space-x-2"><span class="flex h-10 w-10 items-center justify-center rounded-full border-2 border-violet-50 bg-violet-200 text-xs">MK</span><span class="flex h-10 w-10 items-center justify-center rounded-full border-2 border-violet-50 bg-amber-200 text-xs">JL</span><span class="flex h-10 w-10 items-center justify-center rounded-full border-2 border-violet-50 bg-emerald-200 text-xs">PS</span><span class="flex h-10 w-10 items-center justify-center rounded-full border-2 border-violet-50 bg-white text-xs text-violet-700">+6</span></div><div class="min-w-0 flex-1"><div class="flex justify-between gap-4"><div><p class="text-sm font-semibold text-neutral-900">Make room for Alex</p><p id="seatLabel" class="mt-1 text-sm text-neutral-600">9 of 10 seats are in use</p></div><button id="seatDismiss" class="self-start text-neutral-400" aria-label="Dismiss">×</button></div><div class="mt-3 h-1.5 overflow-hidden rounded-full bg-violet-100"><div id="seatProgress" class="h-full w-[90%] rounded-full bg-violet-600"></div></div></div></div><div class="mt-5 flex flex-col justify-between gap-3 border-t border-violet-200 pt-4 sm:flex-row sm:items-center"><p class="text-xs text-neutral-500">5 seats add $32.50 today, then $60/month.</p><div class="flex gap-2"><button class="rounded-lg px-3 py-2 text-xs font-medium text-neutral-600">Review members</button><button id="seatAdd" class="rounded-lg bg-violet-600 px-3 py-2 text-xs font-medium text-white">Add 5 seats</button></div></div><div id="seatConfirm" class="mt-4 hidden rounded-xl bg-white p-4"><p class="text-sm font-medium text-neutral-800">Confirm 5 additional seats?</p><p class="mt-1 text-xs text-neutral-500">Your prorated charge today is $32.50.</p><div class="mt-3 flex justify-end gap-2"><button id="seatCancel" class="px-3 py-2 text-xs text-neutral-500">Cancel</button><button id="seatCommit" class="rounded-lg bg-neutral-900 px-3 py-2 text-xs font-medium text-white">Confirm purchase</button></div></div></aside></div>
<script>
var nudge = document.getElementById("seatNudge"); var confirmBox = document.getElementById("seatConfirm"); document.getElementById("seatDismiss").addEventListener("click", function () { nudge.remove(); }); document.getElementById("seatAdd").addEventListener("click", function () { confirmBox.classList.remove("hidden"); }); document.getElementById("seatCancel").addEventListener("click", function () { confirmBox.classList.add("hidden"); }); document.getElementById("seatCommit").addEventListener("click", function () { document.getElementById("seatLabel").textContent = "9 of 15 seats are in use"; document.getElementById("seatProgress").style.width = "60%"; confirmBox.innerHTML = '<p class="text-sm font-medium text-green-700">✓ Five seats added. Alex can join now.</p>'; });
</script>
</body></html>
