e="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="inline-block h-[1em] w-[1em] shrink-0 align-[-0.125em] transition-transform"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg> All systems operational</a><span class="sm:ml-auto">Privacy · Terms · Security</span><span>© 2026 Northstar</span></div></div></div></footer>
<script>
document.getElementById("footerCopy").addEventListener("click", function () { var button = this; var value = document.getElementById("footerInstall").textContent; var done = function () { button.textContent = "Copied ✓"; setTimeout(function () { button.textContent = "Copy"; }, 1400); }; if (navigator.clipboard) navigator.clipboard.writeText(value).then(done); else { var area = document.createElement("textarea"); area.value = value; document.body.appendChild(area); area.select(); document.execCommand("copy"); area.remove(); done(); } });
</script>
